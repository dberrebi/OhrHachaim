name: iOS

on:
  push:
  pull_request:

# A same-repo pull request is already built by its push. Fork pull requests
# still run here. Cancel a superseded push so a fix does not pay for two
# macOS runs of the same branch.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # macos-26 is the GitHub-hosted image whose default toolchain is Xcode 26
    # (26.6 as of the 20260824 image) with the iOS 26 SDK. See
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
    # The step below still selects an Xcode 26 app, so a later default of Xcode 27
    # does not change this build. Deployment stays iOS 17.
    runs-on: macos-26
    # Three simulators boot in turn for the store screenshots, and a fresh boot
    # takes about 10 minutes on a hosted runner, so a full run is close to an hour.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test -d "$XCODE"

      - name: Choose simulators
        id: sim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          devices = json.loads(raw)["devices"]

          def runtime_version(runtime):
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2)))

          def pick(predicate):
              chosen = None
              for runtime, entries in devices.items():
                  if "iOS" not in runtime:
                      continue
                  for device in entries:
                      if not device.get("isAvailable"):
                          continue
                      name = device.get("name", "")
                      if not predicate(name):
                          continue
                      rank = (runtime_version(runtime), name)
                      if chosen is None or rank > chosen[0]:
                          chosen = (rank, device["udid"], name, runtime)
              return chosen

          iphone = pick(lambda name: name == "iPhone 17 Pro Max")
          iphone_pro = pick(lambda name: name == "iPhone 17 Pro")
          ipad = pick(lambda name: name.startswith("iPad Pro 13-inch"))
          if iphone is None or iphone_pro is None or ipad is None:
              print(json.dumps(devices, indent=2)[:4000], file=sys.stderr)
              sys.exit("Need iPhone 17 Pro, iPhone 17 Pro Max, and iPad Pro 13-inch simulators")
          print(f"iPhone 17 Pro Max {iphone[2]} {iphone[3]} {iphone[1]}", file=sys.stderr)
          print(f"iPhone 17 Pro {iphone_pro[2]} {iphone_pro[3]} {iphone_pro[1]}", file=sys.stderr)
          print(f"iPad {ipad[2]} {ipad[3]} {ipad[1]}", file=sys.stderr)
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"iphone={iphone[1]}\n")
              handle.write(f"iphone_pro={iphone_pro[1]}\n")
              handle.write(f"ipad={ipad[1]}\n")
          PY

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OhrHaChaim/OhrHaChaim.xcodeproj \
            -scheme OhrHaChaim \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Test on iPhone 17 Pro Max and capture screenshots
        run: |
          set -o pipefail
          XCTESTRUN=$(find "${RUNNER_TEMP}/DerivedData" -name '*.xctestrun' -print -quit)
          test -n "$XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # One simulator at a time. With three booted, the runner ran short of memory:
      # the iPad took over 11 minutes to boot and xcodebuild then saw no simulators.
      # Screenshots are written to the runner's disk, so shutting down keeps them.
      - name: Boot the iPhone 17 Pro simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown "${{ steps.sim.outputs.iphone }}" || true
          xcrun simctl boot "${{ steps.sim.outputs.iphone_pro }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.iphone_pro }}" -b

      - name: Capture iPhone 17 Pro screenshots
        run: |
          set -o pipefail
          XCTESTRUN=$(find "${RUNNER_TEMP}/DerivedData" -name '*.xctestrun' -print -quit)
          test -n "$XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone_pro }}" \
            -only-testing:OhrHaChaimUITests/StoreScreenshotUITests \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot the iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown "${{ steps.sim.outputs.iphone }}" || true
          xcrun simctl shutdown "${{ steps.sim.outputs.iphone_pro }}" || true
          xcrun simctl boot "${{ steps.sim.outputs.ipad }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.ipad }}" -b

      - name: Capture iPad 13-inch screenshots
        run: |
          set -o pipefail
          XCTESTRUN=$(find "${RUNNER_TEMP}/DerivedData" -name '*.xctestrun' -print -quit)
          test -n "$XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.ipad }}" \
            -only-testing:OhrHaChaimUITests/StoreScreenshotUITests \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check screenshot sizes
        run: |
          set -euo pipefail
          python3 scripts/prepare_screenshots.py /tmp/shots
          mkdir -p artifacts/appearance artifacts/app-store
          cp /tmp/shots/*-light-home.png /tmp/shots/*-dark-home.png artifacts/appearance/
          cp /tmp/shots/*-light-parasha-list.png /tmp/shots/*-dark-parasha-list.png artifacts/appearance/
          cp /tmp/shots/*-light-home.png artifacts/app-store/
          cp /tmp/shots/*-light-weekly.png artifacts/app-store/
          cp /tmp/shots/*-light-parasha-list.png artifacts/app-store/
          cp /tmp/shots/*-light-reader.png artifacts/app-store/
          cp /tmp/shots/*-light-search.png artifacts/app-store/
          cp /tmp/shots/*-light-settings.png artifacts/app-store/
          find artifacts -type f -name '*.png' | sort

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simulator-screenshots
          path: artifacts/appearance/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-store-screenshots
          path: artifacts/app-store/*.png
          if-no-files-found: error
