name: Walkthrough

# Runs the app in the iPhone simulator, taps through every screen, and uploads
# a screen recording plus a numbered screenshot of each screen. It skips the
# regular test suite to keep the macOS run short.
on:
  push:
    branches: [ccr-d921563f-qmt0au]
  workflow_dispatch:

concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The same choice as ios.yml, which is known to work with this runner's
      # default Xcode, plus an iPad from the same iOS runtime.
      - name: Choose simulators
        id: sim
        timeout-minutes: 3
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          devices = json.loads(raw)["devices"]

          def pick(prefix, exact, runtime_filter=None):
              for wanted_exact in (True, False):
                  for runtime, entries in devices.items():
                      if "iOS" not in runtime or (runtime_filter and runtime != runtime_filter):
                          continue
                      for device in entries:
                          name = device.get("name", "")
                          if not device.get("isAvailable"):
                              continue
                          if (wanted_exact and name == exact) or (not wanted_exact and name.startswith(prefix)):
                              return runtime, device["udid"], name
              return None

          iphone = pick("iPhone", "iPhone 16")
          if iphone is None:
              sys.exit("No available iPhone simulator")
          ipad = pick("iPad", "iPad Pro 13-inch (M4)", iphone[0])
          print(f"Using {iphone[2]} on {iphone[0]}", file=sys.stderr)
          print(f"iphone={iphone[1]}")
          if ipad:
              print(f"Using {ipad[2]} on {ipad[0]}", file=sys.stderr)
              print(f"ipad={ipad[1]}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Build
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OhrHaChaim/OhrHaChaim.xcodeproj \
            -scheme OhrHaChaim \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.iphone }}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Boot the iPhone simulator
        timeout-minutes: 8
        run: |
          UDID="${{ steps.sim.outputs.iphone }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true

      - name: Walk through the app on iPhone and record it
        timeout-minutes: 14
        run: |
          UDID="${{ steps.sim.outputs.iphone }}"
          mkdir -p artifacts/iphone
          rm -rf /tmp/walkthrough-iphone
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force artifacts/walkthrough-iphone.mp4 &
          RECORDER=$!
          sleep 3
          set +e
          TEST_RUNNER_WALKTHROUGH_DIR=/tmp/walkthrough-iphone xcodebuild test-without-building \
            -project OhrHaChaim/OhrHaChaim.xcodeproj \
            -scheme OhrHaChaim \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/Walkthrough.xcresult" \
            -only-testing:OhrHaChaimUITests/WalkthroughUITests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO
          STATUS=$?
          set -e
          sleep 2
          kill -INT "$RECORDER" || true
          wait "$RECORDER" || true
          cp /tmp/walkthrough-iphone/*.png artifacts/iphone/ || true
          ls -l artifacts artifacts/iphone
          exit $STATUS

      - name: Upload the iPhone walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-iphone
          path: artifacts/
          if-no-files-found: warn

      - name: Open the app on iPad
        if: always() && steps.sim.outputs.ipad != ''
        continue-on-error: true
        timeout-minutes: 8
        run: |
          UDID="${{ steps.sim.outputs.ipad }}"
          APP="${RUNNER_TEMP}/DerivedData/Build/Products/Debug-iphonesimulator/OhrHaChaim.app"
          test -d "$APP"
          xcrun simctl shutdown "${{ steps.sim.outputs.iphone }}" || true
          mkdir -p ipad
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.ohrhachaim.OhrHaChaim
          sleep 6
          xcrun simctl io "$UDID" screenshot ipad/01-home.png
          ls -l ipad

      - name: Upload the iPad screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-ipad
          path: ipad/
          if-no-files-found: ignore
